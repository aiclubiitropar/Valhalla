version: '3.8'

services:
  valhalla:
    build:
      context: .
      dockerfile: Dockerfile
    image: valhalla-app
    container_name: valhalla-server
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    # Optional: Mount the data directory if you need persistent state across container restarts
    # volumes:
    #   - ./backend/data:/app/backend/data
    restart: unless-stopped
